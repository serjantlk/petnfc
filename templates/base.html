<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PetNFC{% endblock %}</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;max-width:720px;margin:0 auto;padding:16px;background:#fafafa;color:#222}
    .card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px}
    input,textarea{width:100%;padding:8px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
    button{background:#2563eb;color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer}
    button.danger{background:#dc2626}
    .muted{color:#666;font-size:14px}
    .flash{background:#fef3c7;padding:10px;border-radius:8px;margin-bottom:12px}
    img.pet{max-width:100%;border-radius:12px}
  </style>
</head>
<body>
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
