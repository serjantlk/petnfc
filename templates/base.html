<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{% block title %}PetNFC — Умные метки для питомцев{% endblock %}</title>
  
  <!-- Подключаем современный шрифт Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5;       /* Индиго (основной бренд) */
      --primary-hover: #4338ca;
      --bg: #f8fafc;            /* Светло-серый фон */
      --surface: #ffffff;       /* Белые карточки */
      --text: #1e293b;          /* Темно-серый текст */
      --text-muted: #64748b;    /* Серый текст */
      --success: #10b981;       /* Зеленый */
      --danger: #ef4444;        /* Красный */
      --border: #e2e8f0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Контейнер для центрирования на десктопе */
    .container {
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
    }

    h1, h2, h3 { margin-top: 0; font-weight: 600; letter-spacing: -0.02em; }
    h1 { font-size: 28px; }
    h2 { font-size: 22px; }
    h3 { font-size: 18px; }

    /* Карточки */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      margin-bottom: 20px;
      border: 1px solid rgba(0,0,0,0.02);
    }

    /* Формы */
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 16px; /* Важно: 16px предотвращает зум на iOS */
      font-family: inherit;
      transition: all 0.2s ease;
      background: #f8fafc;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    /* Кнопки */
    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 24px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      font-family: inherit;
    }

    button:hover, .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
    }

    button:active, .btn:active {
      transform: translateY(0);
    }

    button.danger { background-color: var(--danger); }
    button.danger:hover { background-color: #dc2626; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }
    
    button.success { background-color: var(--success); }
    button.success:hover { background-color: #059669; }

    /* Вспомогательные классы */
    .muted { color: var(--text-muted); font-size: 14px; }
    .text-center { text-align: center; }
    .mt-4 { margin-top: 24px; }
    .mb-4 { margin-bottom: 24px; }

    /* Flash-уведомления */
    .flash {
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 15px;
      font-weight: 500;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      animation: slideDown 0.3s ease;
    }
    
    .flash.success { background: #d1fae5; color: #065f46; border-color: #a7f3d0; }
    .flash.error { background: #fee2e2; color: #991b1b; border-color: #fecaca; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Изображения */
    img.pet-photo {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 16px;
      background: #e2e8f0;
    }

    /* Таблицы */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 12px 8px; color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--border); }
    td { padding: 12px 8px; border-bottom: 1px solid var(--border); }

    /* Ссылки */
    a { color: var(--primary); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }

    /* Плашки тегов/меток */
    .badge {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      font-family: monospace;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

  <div class="container">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for category, m in msgs %}
        <div class="flash {% if category != 'message' %}{{ category }}{% endif %}">
          {{ m }}
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

</body>
</html>
