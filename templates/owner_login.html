{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Вход для владельца</h1>
  {% if tag_code %}
    <div class="flash" style="background:#dcfce7; color:#166534;">
      Вы приложили метку <b>{{ tag_code }}</b>. Войдите или зарегистрируйтесь, чтобы привязать её к питомцу.
    </div>
  {% endif %}
  <form method="post">
    <label>Email</label><input name="email" type="email" required>
    <label>Пароль</label><input name="password" type="password" required>
    <button>Войти</button>
  </form>
</div>
{% endblock %}
